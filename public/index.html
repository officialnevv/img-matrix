    :root {
      color-scheme: dark;
      --paper: #2b2d31;
      --white: #383a40;
      --ink: #0f1012;
      --text: #ecece8;
      --muted: #a4a5a0;
      --track: #54565c;
      --lime: #c4f24a;
      --lime-dark: #a8d52f;
      --hover: #43454b;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      background-color: var(--paper);
      background-image: radial-gradient(#3a3c41 1px, transparent 1px);
      background-size: 18px 18px;
      font-family: "Pixel Operator", "Courier New", monospace;
      font-weight: 400;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    .button { color: var(--ink); }
    .button.secondary { color: var(--text); }
    button:focus-visible, input:focus-visible, label:focus-within {
      outline: 3px solid var(--lime);
      outline-offset: 3px;
    }

    .app { width: min(540px, 100%); }
    .app.wide { width: min(1100px, 100%); }
    .app.wide .guide { max-width: 540px; margin-inline: auto; }
    .guide {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    .max { flex: 0 0 82px; width: 82px; height: 82px; image-rendering: pixelated; }
    .max .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    .max .bulb { animation: glow 1.6s steps(2) infinite; }
    .max { animation: bob 2.4s steps(2) infinite; }
    .app.is-processing .max { animation: compute-bob .34s steps(2) infinite; }
    .app.is-processing .max .eye { animation: compute-scan .62s steps(2) infinite; }
    .app.is-processing .max .bulb { animation: compute-glow .28s steps(2) infinite; }
    @keyframes compute-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes compute-scan { 0%, 100% { transform: translateX(-1px) scaleY(1); } 50% { transform: translateX(1px) scaleY(.7); } }
    @keyframes compute-glow { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96%, 98% { transform: scaleY(.15); } }
    @keyframes glow { 50% { opacity: .35; } }
    @keyframes bob { 50% { transform: translateY(-1px); } }
    @media (prefers-reduced-motion: reduce) { .max, .max .eye, .max .bulb, .app.is-processing .max, .app.is-processing .max .eye, .app.is-processing .max .bulb { animation: none; } }
    .speech {
      position: relative;
      flex: 1;
      min-height: 82px;
      display: flex;
      align-items: center;
      padding: 15px 17px;
      border: 3px solid var(--ink);
      background: var(--white);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 24px;
      line-height: 1.25;
    }
    .speech::before, .speech::after {
      content: "";
      position: absolute;
      left: -9px;
      top: 24px;
      width: 12px;
      height: 15px;
    }
    .speech::before { background: var(--ink); clip-path: polygon(6px 0, 12px 0, 12px 15px, 6px 15px, 6px 12px, 3px 12px, 3px 9px, 0 9px, 0 6px, 3px 6px, 3px 3px, 6px 3px); }
    .speech::after { background: var(--white); clip-path: polygon(6px 3px, 12px 3px, 12px 12px, 6px 12px, 6px 9px, 3px 9px, 3px 6px, 6px 6px); }

    .panel {
      padding: 22px;
      border: 3px solid var(--ink);
      background: var(--white);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .step[hidden] { display: none; }
    .pixel, .button, .choice strong {
      font-family: "Pixel Operator", "Courier New", monospace;
    }
    .step-count {
      margin: 0 0 18px;
      color: var(--lime);
      font-family: "Pixel Operator", "Courier New", monospace;
      font-size: 24px;
    }
    .upload {
      min-height: 155px;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 18px;
      border: 2px dashed var(--ink);
      background: var(--paper);
      text-align: center;
      cursor: pointer;
    }
    .upload:hover, .upload.over { background: var(--hover); }
    .upload-icon { color: var(--lime); font-size: 34px; }
    .upload strong, .choice strong { font-size: 24px; line-height: 1.25; }
    .upload small { color: var(--muted); font-size: 20px; line-height: 1.25; }
    #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .upload.has-image { display: block; min-height: 0; padding: 10px; }
    .upload.has-image .upload-icon,
    .upload.has-image strong,
    .upload.has-image small { display: none; }
    .upload-preview {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 420px;
      margin: 0 auto;
      border: 2px solid var(--ink);
    }
    .upload-preview[hidden] { display: none; }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice {
      min-height: 86px;
      padding: 12px;
      border: 2px solid var(--ink);
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .choice:hover { background: var(--hover); }
    .choice.selected { color: var(--ink); background: var(--lime); box-shadow: 3px 3px 0 var(--ink); transform: translate(-2px, -2px); }
    .choice.selected span { color: #2c3a05; }
    .choice span { display: block; margin-top: 7px; color: var(--muted); font-size: 20px; line-height: 1.25; }

    .setting {
      padding: 15px;
      border: 2px solid var(--ink);
      background: var(--paper);
    }
    .setting label { display: flex; justify-content: space-between; gap: 12px; font-size: 24px; line-height: 1.25; }
    .setting output { color: var(--lime); }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 22px;
      margin: 16px 0 5px;
      background: transparent;
      cursor: pointer;
      --a: 50%; --b: 50%;
    }
    /* brightness: fill runs from the centre out to the knob, either side */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; border: 0; border-radius: 0;
      background:
        linear-gradient(var(--ink), var(--ink)) center / 2px 100% no-repeat,
        linear-gradient(to right, var(--track) var(--a), var(--lime) var(--a) var(--b), var(--track) var(--b));
    }
    input[type="range"]::-moz-range-track {
      height: 8px; border: 0; border-radius: 0;
      background:
        linear-gradient(var(--ink), var(--ink)) center / 2px 100% no-repeat,
        linear-gradient(to right, var(--track) var(--a), var(--lime) var(--a) var(--b), var(--track) var(--b));
    }
    /* threshold: no fill bar, just a quiet hairline and the knob */
    input[type="range"].plain::-webkit-slider-runnable-track { height: 2px; background: var(--track); }
    input[type="range"].plain::-moz-range-track { height: 2px; background: var(--track); }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 20px; height: 20px; margin-top: -6px;
      border: 3px solid var(--ink); border-radius: 0; background: var(--lime);
    }
    input[type="range"].plain::-webkit-slider-thumb { margin-top: -9px; }
    input[type="range"]::-moz-range-thumb {
      width: 20px; height: 20px; box-sizing: border-box;
      border: 3px solid var(--ink); border-radius: 0; background: var(--lime);
    }
    .setting-note { margin: 8px 0 0; color: var(--muted); font-size: 20px; line-height: 1.25; }

    .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .actions[hidden] { display: none; }
    .actions { flex-wrap: wrap; align-items: center; }
    .action-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .button {
      min-height: 43px;
      padding: 11px 13px;
      border: 2px solid var(--ink);
      background: var(--lime);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 21px;
      line-height: 1.45;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover { background: var(--lime-dark); }
    .button.secondary { background: var(--paper); }
    .button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result { min-width: 0; }
    .result-title { margin: 0 0 8px; font-family: "Pixel Operator", "Courier New", monospace; font-size: 20px; line-height: 1.25; }
    .image-frame {
      width: min(100%, calc(560px * var(--ratio, 1.5)));
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid var(--ink);
      background: #1d1e21;
      line-height: 0;
    }
    .image-frame img { display: block; width: 100%; height: auto; }
    .empty { padding: 12px; color: var(--muted); font-size: 20px; line-height: 1.25; text-align: center; }
    .status-row { position: relative; margin-top: 13px; min-height: 18px; }
    .status-row .status { margin-top: 0; }
    .loader {
        position: static;
        flex: 0 0 auto;
        min-width: 65px;
        height: 43px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        pointer-events: none;
    }
    .loader[hidden] { display: none; }
    .loader i {
      width: 14px; height: 14px;
      border: 2px solid var(--ink);
      background: var(--lime);
      animation: hop .8s steps(3) infinite;
    }
    .loader i:nth-child(2) { animation-delay: .1s; }
    .loader i:nth-child(3) { animation-delay: .2s; }
    .loader i:nth-child(4) { animation-delay: .3s; }
    .loader i:nth-child(5) { animation-delay: .4s; }
    @keyframes hop {
      0%, 100% { transform: translateY(0); background: var(--lime); }
      50% { transform: translateY(-8px); background: #e9fbb0; }
    }
    @media (prefers-reduced-motion: reduce) { .loader i { animation: none; } }
    .status { min-height: 18px; font-size: 20px; line-height: 1.25; color: var(--lime); }
    .status.error { color: #ff8a8a; }

    @media (max-width: 460px) {
      body { padding: 14px; }
      .guide { gap: 10px; margin-bottom: 17px; }
      .max { flex-basis: 66px; width: 66px; height: 66px; }
      .speech { min-height: 68px; padding: 10px 12px; font-size: 20px; }
      .panel { padding: 16px; }
      .choices, .results { grid-template-columns: 1fr; }
      .choice { min-height: 70px; }
      .button { font-size: 15px; padding: 9px 5px; }
      .actions, .action-group { gap: 6px; }
    }

       and the hard shadow is a drop-shadow so it follows the stepped shape */
    .panel, .speech, .setting, .upload, .upload:hover, .upload.over, .choice, .choice:hover,
    .choice.selected, .button, .button:hover, .button.secondary, .button:disabled,
    .image-frame, .upload-preview { background: transparent; box-shadow: none; }

  <script>
    const byId = (id) => document.getElementById(id);
    const messages = {
      1: "Hey! I'm Max. Pick an image and I'll guide you through the rest.",
      2: "Image ready! What would you like to do with it?",
      3: "Good choice. Adjust the value if you want, then press process.",
      4: "There it is! Save your result or try another operation."
    };

    let selectedFile = null;
    let operation = "grayscale";
    let previewUrl = null;
    let busy = false;

    const hasSettings = (op) => op === "brightness" || op === "bw";

    function setStatus(message, error = false) {
      byId("status").textContent = message;
      byId("status").classList.toggle("error", error);
    }

    function showStep(step) {
      document.querySelectorAll("[data-step]").forEach((panel) => {
        panel.hidden = Number(panel.dataset.step) !== step;
      });
      byId("max-message").textContent = messages[step];
      document.querySelector(".app").classList.toggle("wide", step === 4);
      setStatus("");
    }

    function setPreview(file) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = file ? URL.createObjectURL(file) : null;
      const preview = byId("upload-preview");
      if (previewUrl) {
        preview.src = previewUrl;
        preview.alt = file.name;
        preview.title = file.name;
        preview.hidden = false;
      } else {
        preview.removeAttribute("src");
        preview.alt = "";
        preview.title = "";
        preview.hidden = true;
      }
      byId("dropzone").classList.toggle("has-image", Boolean(previewUrl));
    }

    function updateStepFlow() {
      const total = hasSettings(operation) ? 4 : 3;
      document.querySelectorAll("[data-step]").forEach((panel) => {
        const number = Number(panel.dataset.step);
        const shown = number === 4 ? total : number;
        panel.querySelector(".step-count").textContent = shown + " / " + total;
      });
      const next = byId("to-settings");
      if (!next.disabled) next.textContent = hasSettings(operation) ? "NEXT →" : "PROCESS →";
    }

    function chooseFile(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        setStatus("Choose an image file.", true);
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        setStatus("The image must be smaller than 10 MB.", true);
        return;
      }
      selectedFile = file;
      setPreview(file);
      byId("upload-actions").hidden = false;
      setStatus("");
    }

    function chooseOperation(nextOperation) {
      operation = nextOperation;
      document.querySelectorAll("[data-op]").forEach((button) => {
        button.classList.toggle("selected", button.dataset.op === operation);
      });
      byId("brightness-setting").hidden = operation !== "brightness";
      byId("threshold-setting").hidden = operation !== "bw";
      updateStepFlow();
    }

    function showImage(frameId, source, alt) {
      const image = new Image();
      image.alt = alt;
      image.onload = () => byId(frameId).style.setProperty("--ratio", image.naturalWidth / image.naturalHeight);
      image.src = source;
      byId(frameId).replaceChildren(image);
    }

    async function processImage(button) {
      if (!selectedFile || busy) return;
      busy = true;
      button.disabled = true;
      button.textContent = "WORKING...";
      setStatus("");
      const loader = byId("loader");
      loader.hidden = false;
      button.parentElement.insertBefore(loader, button);
      document.querySelector(".app").classList.add("is-processing");
      byId("max-message").textContent = "Computing... Max is crunching the pixels!";

      const form = new FormData();
      form.append("image", selectedFile);
      form.append("op", operation);
      form.append("brightness", byId("brightness").value);
      form.append("threshold", byId("threshold").value);

      try {
        const response = await fetch("/api/process", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not process the image.");
        showImage("original-frame", data.original, "Original image");
        showImage("result-frame", data.result, "Processed image");
        byId("save").href = data.result;
        byId("save").download = "matrix-" + operation + ".png";
        showStep(4);
      } catch (error) {
        setStatus(error.message || "Could not process the image.", true);
      } finally {
        busy = false;
        document.querySelector(".app").classList.remove("is-processing");
        const loader = byId("loader");
        loader.hidden = true;
        byId("status").parentElement.appendChild(loader);
        if (byId("status").textContent) byId("max-message").textContent = messages[3] === undefined ? "Let's try that again." : messages[3];
        button.disabled = false;
        byId("process").textContent = "PROCESS →";
        updateStepFlow();
      }
    }

    byId("file").addEventListener("change", (event) => chooseFile(event.target.files[0]));
    byId("to-operations").addEventListener("click", () => showStep(2));
    document.querySelectorAll("[data-op]").forEach((button) => {
      button.addEventListener("click", () => chooseOperation(button.dataset.op));
    });
    byId("to-settings").addEventListener("click", (event) => {
      if (hasSettings(operation)) showStep(3);
      else processImage(event.currentTarget);
    });
    document.querySelectorAll("[data-back]").forEach((button) => {
      button.addEventListener("click", () => showStep(Number(button.dataset.back)));
    });
    function paintBrightness() {
      const el = byId("brightness");
      const pos = (Number(el.value) - Number(el.min)) / (Number(el.max) - Number(el.min)) * 100;
      el.style.setProperty("--a", Math.min(50, pos) + "%");
      el.style.setProperty("--b", Math.max(50, pos) + "%");
    }
    paintBrightness();
    byId("brightness").addEventListener("input", () => {
      paintBrightness();
      const value = Number(byId("brightness").value);
      byId("brightness-value").textContent = value > 0 ? "+" + value : String(value);
    });
    byId("threshold").addEventListener("input", () => {
      byId("threshold-value").textContent = byId("threshold").value;
    });
    byId("process").addEventListener("click", (event) => processImage(event.currentTarget));
    byId("again").addEventListener("click", () => showStep(2));
    byId("new-image").addEventListener("click", () => {
      selectedFile = null;
      byId("file").value = "";
      setPreview(null);
      byId("upload-actions").hidden = true;
      showStep(1);
    });

    const dropzone = byId("dropzone");
    ["dragenter", "dragover"].forEach((name) => dropzone.addEventListener(name, (event) => {
      event.preventDefault();
      dropzone.classList.add("over");
    }));
    ["dragleave", "drop"].forEach((name) => dropzone.addEventListener(name, (event) => {
      event.preventDefault();
      dropzone.classList.remove("over");
    }));
    dropzone.addEventListener("drop", (event) => chooseFile(event.dataTransfer.files[0]));

    chooseOperation("grayscale");
    showStep(1);
  </script>
</body>
</html>

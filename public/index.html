<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e8">
  <title>Image Matrix Project</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --paper: #f7f3e8;
      --white: #fffdf7;
      --ink: #252b3d;
      --blue: #4264d8;
      --green: #d9ef83;
      --pink: #ff9baa;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d9d2c1 1px, transparent 1px);
      background-size: 18px 18px;
      font-family: "Courier New", monospace;
      font-weight: 700;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, label:focus-within {
      outline: 3px solid var(--pink);
      outline-offset: 3px;
    }

    .app { width: min(540px, 100%); }
    .app.wide { width: min(1100px, 100%); }
    .app.wide .guide { max-width: 540px; margin-inline: auto; }
    .guide {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
    }
    .max { flex: 0 0 82px; width: 82px; height: 82px; image-rendering: pixelated; }
    .speech {
      position: relative;
      flex: 1;
      min-height: 82px;
      display: flex;
      align-items: center;
      padding: 15px 17px;
      border: 3px solid var(--ink);
      background: var(--white);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 15px;
      line-height: 1.5;
    }
    .speech::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 30px;
      width: 12px;
      height: 12px;
      background: var(--white);
      border-left: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      transform: rotate(45deg);
    }

    .panel {
      padding: 22px;
      border: 3px solid var(--ink);
      background: var(--white);
      box-shadow: 5px 5px 0 var(--ink);
    }
    .step[hidden] { display: none; }
    .pixel, .button, .choice strong {
      font-family: "Press Start 2P", "Courier New", monospace;
    }
    .step-count {
      margin: 0 0 18px;
      color: var(--blue);
      font-family: "Press Start 2P", "Courier New", monospace;
      font-size: 9px;
    }
    .upload {
      min-height: 155px;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 18px;
      border: 2px dashed var(--ink);
      background: var(--paper);
      text-align: center;
      cursor: pointer;
    }
    .upload:hover, .upload.over { background: #e9edff; }
    .upload-icon { color: var(--blue); font-size: 34px; }
    .upload strong, .choice strong { font-size: 9px; line-height: 1.8; }
    .upload small { color: #666; font-size: 12px; }
    #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .upload.has-image { display: block; min-height: 0; padding: 10px; }
    .upload.has-image .upload-icon,
    .upload.has-image strong,
    .upload.has-image small { display: none; }
    .upload-preview {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 420px;
      margin: 0 auto;
      border: 2px solid var(--ink);
    }
    .upload-preview[hidden] { display: none; }

    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice {
      min-height: 86px;
      padding: 12px;
      border: 2px solid var(--ink);
      background: var(--paper);
      text-align: left;
      cursor: pointer;
    }
    .choice:hover { background: #e9edff; }
    .choice.selected { background: var(--green); box-shadow: 3px 3px 0 var(--ink); transform: translate(-2px, -2px); }
    .choice span { display: block; margin-top: 7px; color: #555; font-size: 12px; line-height: 1.35; }

    .setting {
      padding: 15px;
      border: 2px solid var(--ink);
      background: var(--paper);
    }
    .setting label { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
    .setting output { color: var(--blue); }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      margin: 18px 0 5px;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border: 0;
      border-radius: 0;
      background: var(--blue);
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      border: 0;
      border-radius: 0;
      background: var(--blue);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -5px;
      border: 0;
      border-radius: 0;
      background: var(--blue);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 0;
      border-radius: 0;
      background: var(--blue);
    }
    .setting-note { margin: 8px 0 0; color: #666; font-size: 12px; line-height: 1.4; }

    .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; }
    .actions[hidden] { display: none; }
    .button {
      min-height: 43px;
      padding: 11px 13px;
      border: 2px solid var(--ink);
      background: var(--green);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 8px;
      line-height: 1.7;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover { background: #cbe66a; }
    .button.secondary { background: var(--paper); }
    .button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .result { min-width: 0; }
    .result-title { margin: 0 0 8px; font-family: "Press Start 2P", "Courier New", monospace; font-size: 8px; line-height: 1.8; }
    .image-frame {
      width: min(100%, calc(560px * var(--ratio, 1.5)));
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid var(--ink);
      background: #e9e4d6;
      line-height: 0;
    }
    .image-frame img { display: block; width: 100%; height: auto; }
    .empty { padding: 12px; color: #666; font-size: 11px; text-align: center; }
    .loader { display: flex; justify-content: center; gap: 8px; padding-top: 10px; margin-top: 8px; }
    .loader[hidden] { display: none; }
    .loader i {
      width: 14px;
      height: 14px;
      border: 2px solid var(--ink);
      background: var(--blue);
      animation: hop .8s steps(3) infinite;
    }
    .loader i:nth-child(2) { animation-delay: .1s; }
    .loader i:nth-child(3) { animation-delay: .2s; }
    .loader i:nth-child(4) { animation-delay: .3s; }
    .loader i:nth-child(5) { animation-delay: .4s; }
    @keyframes hop {
      0%, 100% { transform: translateY(0); background: var(--blue); }
      50% { transform: translateY(-10px); background: var(--green); }
    }
    @media (prefers-reduced-motion: reduce) { .loader i { animation: none; } }
    .status { min-height: 18px; margin-top: 13px; color: var(--blue); font-size: 12px; }
    .status.error { color: #b42336; }

    @media (max-width: 460px) {
      body { padding: 14px; }
      .guide { gap: 10px; margin-bottom: 17px; }
      .max { flex-basis: 66px; width: 66px; height: 66px; }
      .speech { min-height: 68px; padding: 10px 12px; font-size: 13px; }
      .panel { padding: 16px; }
      .choices, .results { grid-template-columns: 1fr; }
      .choice { min-height: 70px; }
      .button { font-size: 7px; padding: 9px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="guide" aria-live="polite">
      <svg class="max" viewBox="0 0 16 16" role="img" aria-label="Max" shape-rendering="crispEdges">
        <rect x="4" y="1" width="8" height="2" fill="#252b3d"/>
        <rect x="2" y="3" width="12" height="9" fill="#252b3d"/>
        <rect x="3" y="4" width="10" height="7" fill="#4264d8"/>
        <rect x="1" y="5" width="1" height="4" fill="#252b3d"/>
        <rect x="14" y="5" width="1" height="4" fill="#252b3d"/>
        <rect x="5" y="6" width="2" height="2" fill="#fffdf7"/>
        <rect x="9" y="6" width="2" height="2" fill="#fffdf7"/>
        <rect x="6" y="7" width="1" height="1" fill="#252b3d"/>
        <rect x="10" y="7" width="1" height="1" fill="#252b3d"/>
        <rect x="7" y="9" width="2" height="1" fill="#d9ef83"/>
        <rect x="4" y="12" width="3" height="2" fill="#252b3d"/>
        <rect x="9" y="12" width="3" height="2" fill="#252b3d"/>
      </svg>
      <div class="speech" id="max-message">Hey! I'm Max. Pick an image and I'll guide you through the rest.</div>
    </section>

    <section class="panel">
      <div class="step" data-step="1">
        <p class="step-count">1 / 4</p>
        <label class="upload" id="dropzone">
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif">
          <img class="upload-preview" id="upload-preview" alt="" hidden>
          <span class="upload-icon">▧</span>
          <strong>CHOOSE AN IMAGE</strong>
          <small>Click or drop an image here</small>
        </label>
        <div class="actions" id="upload-actions" hidden>
          <span></span>
          <button class="button" id="to-operations" type="button">NEXT →</button>
        </div>
      </div>

      <div class="step" data-step="2" hidden>
        <p class="step-count">2 / 4</p>
        <div class="choices">
          <button class="choice selected" type="button" data-op="grayscale">
            <strong>GRAYSCALE</strong><span>Turn colours into grey.</span>
          </button>
          <button class="choice" type="button" data-op="brightness">
            <strong>BRIGHTNESS</strong><span>Make it lighter or darker.</span>
          </button>
          <button class="choice" type="button" data-op="flip">
            <strong>FLIP</strong><span>Mirror it horizontally.</span>
          </button>
          <button class="choice" type="button" data-op="bw">
            <strong>BLACK & WHITE</strong><span>Keep only black and white.</span>
          </button>
        </div>
        <div class="actions">
          <button class="button secondary" data-back="1" type="button">← BACK</button>
          <button class="button" id="to-settings" type="button">NEXT →</button>
        </div>
      </div>

      <div class="step" data-step="3" hidden>
        <p class="step-count">3 / 4</p>
        <div class="setting" id="brightness-setting" hidden>
          <label for="brightness"><span>BRIGHTNESS</span><output id="brightness-value">+50</output></label>
          <input type="range" id="brightness" min="-100" max="100" value="50">
          <p class="setting-note">Move left to darken, right to brighten.</p>
        </div>
        <div class="setting" id="threshold-setting" hidden>
          <label for="threshold"><span>THRESHOLD</span><output id="threshold-value">128</output></label>
          <input type="range" id="threshold" min="0" max="255" value="128">
          <p class="setting-note">Pixels at or above this value become white.</p>
        </div>
        <div class="actions">
          <button class="button secondary" data-back="2" type="button">← BACK</button>
          <button class="button" id="process" type="button">PROCESS →</button>
        </div>
      </div>

      <div class="step" data-step="4" hidden>
        <p class="step-count">4 / 4</p>
        <div class="results">
          <div class="result">
            <p class="result-title">ORIGINAL</p>
            <div class="image-frame" id="original-frame"></div>
          </div>
          <div class="result">
            <p class="result-title">RESULT</p>
            <div class="image-frame" id="result-frame"></div>
          </div>
        </div>
        <div class="actions">
          <button class="button secondary" id="again" type="button">ANOTHER OPERATION</button>
          <a class="button" id="save" download="matrix-result.png">SAVE ↓</a>
        </div>
        <div class="actions">
          <button class="button secondary" id="new-image" type="button">NEW IMAGE</button>
        </div>
      </div>

      <div class="loader" id="loader" role="img" aria-label="Processing" hidden>
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const byId = (id) => document.getElementById(id);
    const messages = {
      1: "Hey! I'm Max. Pick an image and I'll guide you through the rest.",
      2: "Image ready! What would you like to do with it?",
      3: "Good choice. Adjust the value if you want, then press process.",
      4: "There it is! Save your result or try another operation."
    };

    let selectedFile = null;
    let operation = "grayscale";
    let previewUrl = null;
    let busy = false;

    const hasSettings = (op) => op === "brightness" || op === "bw";

    function setStatus(message, error = false) {
      byId("status").textContent = message;
      byId("status").classList.toggle("error", error);
    }

    function showStep(step) {
      document.querySelectorAll("[data-step]").forEach((panel) => {
        panel.hidden = Number(panel.dataset.step) !== step;
      });
      byId("max-message").textContent = messages[step];
      document.querySelector(".app").classList.toggle("wide", step === 4);
      setStatus("");
    }

    function setPreview(file) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = file ? URL.createObjectURL(file) : null;
      const preview = byId("upload-preview");
      if (previewUrl) {
        preview.src = previewUrl;
        preview.alt = file.name;
        preview.title = file.name;
        preview.hidden = false;
      } else {
        preview.removeAttribute("src");
        preview.alt = "";
        preview.title = "";
        preview.hidden = true;
      }
      byId("dropzone").classList.toggle("has-image", Boolean(previewUrl));
    }

    function updateStepFlow() {
      const total = hasSettings(operation) ? 4 : 3;
      document.querySelectorAll("[data-step]").forEach((panel) => {
        const number = Number(panel.dataset.step);
        const shown = number === 4 ? total : number;
        panel.querySelector(".step-count").textContent = shown + " / " + total;
      });
      const next = byId("to-settings");
      if (!next.disabled) next.textContent = hasSettings(operation) ? "NEXT →" : "PROCESS →";
    }

    function chooseFile(file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        setStatus("Choose an image file.", true);
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        setStatus("The image must be smaller than 10 MB.", true);
        return;
      }
      selectedFile = file;
      setPreview(file);
      byId("upload-actions").hidden = false;
      setStatus("");
    }

    function chooseOperation(nextOperation) {
      operation = nextOperation;
      document.querySelectorAll("[data-op]").forEach((button) => {
        button.classList.toggle("selected", button.dataset.op === operation);
      });
      byId("brightness-setting").hidden = operation !== "brightness";
      byId("threshold-setting").hidden = operation !== "bw";
      updateStepFlow();
    }

    function showImage(frameId, source, alt) {
      const image = new Image();
      image.alt = alt;
      image.onload = () => byId(frameId).style.setProperty("--ratio", image.naturalWidth / image.naturalHeight);
      image.src = source;
      byId(frameId).replaceChildren(image);
    }

    async function processImage(button) {
      if (!selectedFile || busy) return;
      busy = true;
      button.disabled = true;
      button.textContent = "WORKING...";
      setStatus("");
      byId("loader").hidden = false;

      const form = new FormData();
      form.append("image", selectedFile);
      form.append("op", operation);
      form.append("brightness", byId("brightness").value);
      form.append("threshold", byId("threshold").value);

      try {
        const response = await fetch("/api/process", { method: "POST", body: form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not process the image.");
        showImage("original-frame", data.original, "Original image");
        showImage("result-frame", data.result, "Processed image");
        byId("save").href = data.result;
        byId("save").download = "matrix-" + operation + ".png";
        showStep(4);
      } catch (error) {
        setStatus(error.message || "Could not process the image.", true);
      } finally {
        busy = false;
        byId("loader").hidden = true;
        button.disabled = false;
        byId("process").textContent = "PROCESS →";
        updateStepFlow();
      }
    }

    byId("file").addEventListener("change", (event) => chooseFile(event.target.files[0]));
    byId("to-operations").addEventListener("click", () => showStep(2));
    document.querySelectorAll("[data-op]").forEach((button) => {
      button.addEventListener("click", () => chooseOperation(button.dataset.op));
    });
    byId("to-settings").addEventListener("click", (event) => {
      if (hasSettings(operation)) showStep(3);
      else processImage(event.currentTarget);
    });
    document.querySelectorAll("[data-back]").forEach((button) => {
      button.addEventListener("click", () => showStep(Number(button.dataset.back)));
    });
    byId("brightness").addEventListener("input", () => {
      const value = Number(byId("brightness").value);
      byId("brightness-value").textContent = value > 0 ? "+" + value : String(value);
    });
    byId("threshold").addEventListener("input", () => {
      byId("threshold-value").textContent = byId("threshold").value;
    });
    byId("process").addEventListener("click", (event) => processImage(event.currentTarget));
    byId("again").addEventListener("click", () => showStep(2));
    byId("new-image").addEventListener("click", () => {
      selectedFile = null;
      byId("file").value = "";
      setPreview(null);
      byId("upload-actions").hidden = true;
      showStep(1);
    });

    const dropzone = byId("dropzone");
    ["dragenter", "dragover"].forEach((name) => dropzone.addEventListener(name, (event) => {
      event.preventDefault();
      dropzone.classList.add("over");
    }));
    ["dragleave", "drop"].forEach((name) => dropzone.addEventListener(name, (event) => {
      event.preventDefault();
      dropzone.classList.remove("over");
    }));
    dropzone.addEventListener("drop", (event) => chooseFile(event.dataTransfer.files[0]));

    chooseOperation("grayscale");
    showStep(1);
  </script>
</body>
</html>
